<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}주식 분석{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">
        <i class="fa-solid fa-chart-line me-2"></i>StockRadar
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint and 'korean' in request.endpoint %}active{% endif %}"
               href="{{ url_for('korean.index') }}">
              <i class="fa-solid fa-won-sign me-1"></i>국내시장
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint and 'us' in request.endpoint %}active{% endif %}"
               href="{{ url_for('us.index') }}">
              <i class="fa-solid fa-dollar-sign me-1"></i>미국시장
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-dark text-secondary text-center py-3 mt-5">
    <small>StockRadar &copy; 2026 &mdash; 본 정보는 투자 참고용이며 투자 결정의 책임은 본인에게 있습니다.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
