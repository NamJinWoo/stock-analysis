<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}주식 분석{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
  <script>
    /* Apply stored theme before page renders to prevent flash */
    (function() {
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.addEventListener('DOMContentLoaded', function() {
        document.body.setAttribute('data-theme', t);
      });
    })();
  </script>
</head>
<body>
  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-3">
      <a class="navbar-brand fw-bold me-3" href="{{ url_for('main.index') }}">
        <i class="fa-solid fa-chart-line me-2"></i>StockRadar
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
              aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-3">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint and 'korean' in request.endpoint %}active{% endif %}"
               href="{{ url_for('korean.index') }}">
              <i class="fa-solid fa-won-sign me-1"></i>국내시장
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint and 'us' in request.endpoint %}active{% endif %}"
               href="{{ url_for('us.index') }}">
              <i class="fa-solid fa-dollar-sign me-1"></i>미국시장
            </a>
          </li>
        </ul>

        <!-- Universal Search -->
        <form class="d-flex navbar-search ms-auto me-2" action="{{ url_for('api.search_redirect') }}" method="get">
          <select name="market" class="form-select form-select-sm border-end-0 rounded-0 rounded-start"
                  style="width:auto;border-radius:20px 0 0 20px !important;">
            <option value="us">🇺🇸 US</option>
            <option value="korean">🇰🇷 KR</option>
          </select>
          <input class="form-control form-control-sm" type="search" name="q"
                 placeholder="종목 검색…" aria-label="Search" style="min-width:130px;border-radius:0;" />
          <button class="btn btn-outline-light btn-sm" type="submit" style="border-radius:0 20px 20px 0;">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>

        <!-- Dark mode toggle -->
        <button id="dark-mode-toggle" title="Toggle dark mode" class="ms-1">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container-fluid px-3 px-md-4 py-4" style="max-width:1400px;margin:0 auto;">
    {% block content %}{% endblock %}
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="bg-dark text-secondary text-center py-3 mt-5">
    <small>StockRadar &copy; 2026 &mdash; 본 정보는 투자 참고용이며 투자 결정의 책임은 본인에게 있습니다.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
