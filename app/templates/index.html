{% extends "base.html" %}
{% block title %}StockRadar - 홈{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-4 fw-bold mb-3">StockRadar</h1>
  <p class="lead text-muted mb-5">국내외 시장의 오늘 흐름, 상승/하락 종목, 추천 종목을 한눈에 확인하세요.</p>
  <div class="row g-4 justify-content-center">
    <div class="col-md-5">
      <a href="{{ url_for('korean.index') }}" class="text-decoration-none">
        <div class="card h-100 border-0 shadow-sm market-card">
          <div class="card-body py-5">
            <div class="display-1 mb-3">🇰🇷</div>
            <h3 class="fw-bold">국내 시장</h3>
            <p class="text-muted">KOSPI · KOSDAQ<br>국내 주식 분석 및 추천 종목</p>
            <span class="btn btn-outline-primary mt-2">분석 보기</span>
          </div>
        </div>
      </a>
    </div>
    <div class="col-md-5">
      <a href="{{ url_for('us.index') }}" class="text-decoration-none">
        <div class="card h-100 border-0 shadow-sm market-card">
          <div class="card-body py-5">
            <div class="display-1 mb-3">🇺🇸</div>
            <h3 class="fw-bold">미국 시장</h3>
            <p class="text-muted">S&amp;P 500 · NASDAQ · DOW<br>미국 주식 분석 및 추천 종목</p>
            <span class="btn btn-outline-success mt-2">분석 보기</span>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
{% endblock %}
